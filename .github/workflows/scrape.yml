name: Scrape & Filter Proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: GeoLite cache key
        id: geo-date
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache GeoLite2 Country
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/GeoLite2-Country.mmdb
          key: geolite2-country-${{ runner.os }}-${{ steps.geo-date.outputs.week }}

      - name: Install dependencies
        run: pip install aiohttp aiohttp-socks beautifulsoup4 geoip2

      - name: Fetch shared geolocation layer
        run: |
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_country.py -o geo_country.py
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_runner.py -o geo_runner.py

      - name: Run aggregator with MaxMind/IPinfo geolocation
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python geo_runner.py scripts/proxy-aggregator.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f geo_country.py geo_runner.py
          for i in {1..3}; do
            git add -A
            git diff --cached --quiet || git commit -m "Update proxy lists [skip ci]"
            git pull --rebase --autostash origin main && git push && break
            echo "Push failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
