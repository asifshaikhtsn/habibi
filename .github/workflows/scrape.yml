name: Scrape & Filter Proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4

      - name: Run aggregator
        run: python scripts/proxy-aggregator.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in {1..3}; do
            git add -A
            git diff --cached --quiet || git commit -m "Update proxy lists [skip ci]"
            git pull --rebase --autostash origin main && git push && break
            echo "Push failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
